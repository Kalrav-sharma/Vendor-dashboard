<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <div>
        <h1>Admin Console</h1>
        <div class="scope" id="scope-line">Loading…</div>
      </div>
      <div class="who">
        <span id="who-line"></span><br>
        <button class="link-btn" id="signout-btn">Sign out</button>
      </div>
    </header>

    <div class="panel">
      <h2>Create vendor login</h2>
      <div id="create-msg"></div>
      <form id="create-form">
        <div class="panel-grid">
          <div class="field">
            <label for="v-email">Email</label>
            <input type="email" id="v-email" required>
          </div>
          <div class="field">
            <label for="v-password">Temporary password</label>
            <input type="text" id="v-password" required minlength="8" placeholder="min 8 characters">
          </div>
          <div class="field">
            <label for="v-code">Uniware vendor code</label>
            <input type="text" id="v-code" required placeholder="e.g. Vendor-156">
          </div>
          <div class="field">
            <label for="v-name">Vendor display name</label>
            <input type="text" id="v-name" placeholder="e.g. LEXCRU WATER TECH PVT LTD">
          </div>
        </div>
        <button type="submit" class="primary-btn" id="create-btn" style="width: auto; padding: 9px 20px; margin-top: 16px;">Create login</button>
      </form>
    </div>

    <div class="panel">
      <h2>Vendors on the portal</h2>
      <div id="vendors-list" class="loading">Loading…</div>
    </div>

    <div class="panel">
      <h2>All purchase orders</h2>
      <div class="field" style="max-width: 280px; margin-bottom: 16px;">
        <label for="vendor-filter">Filter by vendor</label>
        <select id="vendor-filter">
          <option value="">All vendors</option>
        </select>
      </div>
      <div id="content"><div class="loading">Loading…</div></div>
    </div>

    <footer class="page-foot">Data refreshes automatically every ~5 minutes from Uniware.</footer>
  </div>

<script>
  const TERMINAL = new Set(["COMPLETE", "REJECTED", "CANCELLED", "CLOSED"]);
  const STATUS_META = {
    COMPLETE: ["Complete", "good"],
    APPROVED: ["Approved · open", "open"],
    CREATED: ["Created · open", "open"],
    REJECTED: ["Rejected", "critical"],
    CANCELLED: ["Cancelled", "muted"],
  };

  function fmtNum(n) { return (n === null || n === undefined) ? "–" : Number(n).toLocaleString("en-IN"); }
  function fmtMoney(n) { return (n === null || n === undefined) ? "–" : "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 }); }
  function fmtDate(iso) {
    if (!iso) return "–";
    const d = new Date(iso);
    return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" }) + ", " +
           d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
  }
  function statusChip(status) {
    const [label, cls] = STATUS_META[status] || [status || "Unknown", "muted"];
    return `<span class="chip chip-${cls}">${label}</span>`;
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  let allPos = [], grnsByPo = {}, client;

  async function main() {
    const ctx = await requireSession();
    if (!ctx) return;
    if (ctx.profile.role !== "admin") {
      window.location.href = "vendor.html";
      return;
    }
    client = ctx.client;
    document.getElementById("who-line").innerHTML = `<b>${escapeHtml(ctx.profile.vendor_name || "Admin")}</b>`;
    document.getElementById("signout-btn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "login.html";
    });

    await Promise.all([loadVendors(), loadPurchaseOrders()]);

    document.getElementById("vendor-filter").addEventListener("change", renderTable);
  }

  async function loadVendors() {
    const { data: vendors, error } = await client.from("profiles").select("*").eq("role", "vendor").order("created_at", { ascending: false });
    const box = document.getElementById("vendors-list");
    if (error) {
      box.innerHTML = `<div class="alert">Failed to load vendors: ${escapeHtml(error.message)}</div>`;
      return;
    }
    if (!vendors.length) {
      box.innerHTML = `<div class="empty-state">No vendor logins created yet — use the form above.</div>`;
    } else {
      box.innerHTML = `<div class="table-card"><div class="table-scroll"><table>
        <thead><tr><th>Vendor code</th><th>Vendor name</th><th>Email</th><th>Created</th></tr></thead>
        <tbody>${vendors.map(v => `<tr>
          <td class="mono">${escapeHtml(v.vendor_code)}</td>
          <td>${escapeHtml(v.vendor_name || "–")}</td>
          <td class="mono">${escapeHtml(v.email || "–")}</td>
          <td class="mono">${fmtDate(v.created_at)}</td>
        </tr>`).join("")}</tbody>
      </table></div></div>`;
    }
    const select = document.getElementById("vendor-filter");
    for (const v of vendors) {
      const opt = document.createElement("option");
      opt.value = v.vendor_code;
      opt.textContent = `${v.vendor_code} — ${v.vendor_name || ""}`;
      select.appendChild(opt);
    }
  }

  async function loadPurchaseOrders() {
    const [{ data: pos, error: poErr }, { data: grns }] = await Promise.all([
      client.from("purchase_orders").select("*").order("created_at", { ascending: false }),
      client.from("grns").select("*"),
    ]);
    if (poErr) {
      document.getElementById("content").innerHTML = `<div class="alert">Failed to load purchase orders: ${escapeHtml(poErr.message)}</div>`;
      return;
    }
    allPos = pos;
    grnsByPo = {};
    for (const g of (grns || [])) (grnsByPo[g.po_code] ||= []).push(g);
    renderTable();
  }

  function renderTable() {
    const filter = document.getElementById("vendor-filter").value;
    const pos = filter ? allPos.filter(p => p.vendor_code === filter) : allPos;

    document.getElementById("scope-line").textContent =
      `${allPos.length} purchase order${allPos.length === 1 ? "" : "s"} across all vendors` +
      (filter ? ` · showing ${pos.length} for ${filter}` : "");

    const rows = pos.map(p => {
      const grns = grnsByPo[p.po_code] || [];
      const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];
      const recv = grns.reduce((s, g) => s + (Number(g.total_received_amount) || 0), 0);
      const rej = grns.reduce((s, g) => s + (Number(g.total_rejected_amount) || 0), 0);
      const grnCell = grns.length === 0
        ? `<span class="cell-empty">not yet raised</span>`
        : `<div class="invoice-list">${escapeHtml(invoices.join(", ") || "–")}</div><div class="grn-amt">${fmtMoney(recv)}${rej ? ` <span class="grn-rej">−${fmtMoney(rej)} rej.</span>` : ""}</div>`;
      return `<tr>
        <td class="mono">${escapeHtml(p.vendor_code)}</td>
        <td class="fac-code">${escapeHtml(p.facility)}</td>
        <td class="mono">${escapeHtml(p.po_code)}</td>
        <td>${statusChip(p.status)}</td>
        <td class="mono">${fmtDate(p.created_at)}</td>
        <td class="num mono">${fmtNum(p.qty_ordered)}</td>
        <td class="num mono">${fmtNum(p.qty_received)}</td>
        <td class="num mono">${fmtMoney(p.total_amount)}</td>
        <td>${grnCell}</td>
      </tr>`;
    }).join("");

    document.getElementById("content").innerHTML = `
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead><tr>
          <th>Vendor</th><th>Facility</th><th>PO code</th><th>Status</th><th>Created</th>
          <th class="num">Qty ordered</th><th class="num">Received</th><th class="num">PO value</th><th>GRN / invoice</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="9" class="empty-state">No purchase orders.</td></tr>`}</tbody>
      </table>
      </div></div>
    `;
  }

  document.getElementById("create-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msgBox = document.getElementById("create-msg");
    const btn = document.getElementById("create-btn");
    msgBox.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "Creating…";

    const email = document.getElementById("v-email").value.trim();
    const password = document.getElementById("v-password").value;
    const vendor_code = document.getElementById("v-code").value.trim();
    const vendor_name = document.getElementById("v-name").value.trim();

    const { data, error } = await client.functions.invoke("admin-create-vendor", {
      body: { email, password, vendor_code, vendor_name },
    });

    btn.disabled = false;
    btn.textContent = "Create login";

    if (error || data?.error) {
      msgBox.innerHTML = `<div class="form-error">${escapeHtml(data?.error || error.message)}</div>`;
      return;
    }

    msgBox.innerHTML = `<div class="form-success">Login created for ${escapeHtml(email)} (${escapeHtml(vendor_code)}). Share the email + temporary password with the vendor directly — this page will not show the password again.</div>`;
    document.getElementById("create-form").reset();
    await loadVendors();
  });

  main();
</script>
</body>
</html>
