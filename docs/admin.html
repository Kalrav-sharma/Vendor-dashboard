<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app-common.js"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">Admin Console</div>
      <button class="nav-item active" id="nav-po-tracking">PO Tracking</button>
      <button class="nav-item" id="nav-sku-data">SKU Level Data</button>
      <button class="nav-item" id="nav-manage-vendors">Manage Vendors</button>
    </nav>

    <div class="main-content">
      <div class="wrap">
        <header class="page-head">
          <div>
            <h1 id="page-title">PO Tracking</h1>
            <div class="scope" id="scope-line">Loading…</div>
          </div>
          <div class="who">
            <span id="who-line"></span><br>
            <button class="link-btn" id="signout-btn">Sign out</button>
          </div>
        </header>

        <div id="view-po-tracking">
          <div id="po-content"><div class="loading">Loading…</div></div>
        </div>

        <div id="view-sku-data" hidden>
          <div class="field" style="max-width: 340px; margin-bottom: 16px;">
            <label for="sku-po-filter">Filter by PO code</label>
            <select id="sku-po-filter">
              <option value="">All purchase orders</option>
            </select>
          </div>
          <div id="sku-content"><div class="loading">Loading…</div></div>
        </div>

        <div id="view-manage-vendors" hidden>
          <div class="panel">
            <h2>Create vendor login</h2>
            <div id="create-msg"></div>
            <form id="create-form">
              <div class="panel-grid">
                <div class="field">
                  <label for="v-email">Email</label>
                  <input type="email" id="v-email" required>
                </div>
                <div class="field">
                  <label for="v-password">Temporary password</label>
                  <input type="text" id="v-password" required minlength="8" placeholder="min 8 characters">
                </div>
                <div class="field">
                  <label for="v-code">Uniware vendor code</label>
                  <input type="text" id="v-code" required placeholder="e.g. Vendor-156">
                </div>
                <div class="field">
                  <label for="v-name">Vendor display name</label>
                  <input type="text" id="v-name" placeholder="e.g. LEXCRU WATER TECH PVT LTD">
                </div>
              </div>
              <button type="submit" class="primary-btn" id="create-btn" style="width: auto; padding: 9px 20px; margin-top: 16px;">Create login</button>
            </form>
          </div>

          <div class="panel">
            <h2>Vendors on the portal</h2>
            <div id="vendors-list" class="loading">Loading…</div>
          </div>
        </div>

        <footer class="page-foot">Data refreshes automatically every ~5 minutes from Uniware. <span id="last-updated"></span></footer>
      </div>
    </div>
  </div>

<script>
  let client, vendors = [], vendorNameByCode = {}, currentPos = [];
  let poItemsByPo = {}, grnsByPo = {}, grnByCode = {}, grnItemsByPoSku = {};
  const POLL_INTERVAL_MS = 60 * 1000;
  let poShellBuilt = false;
  let poFilters = { search: "", vendor: "", facility: "", poCode: "", status: "", qtyOrdered: "", qtyReceived: "", poValue: "", grn: "" };

  const showSection = setupSidebarNav(
    [
      { navId: "nav-po-tracking", viewId: "view-po-tracking" },
      { navId: "nav-sku-data", viewId: "view-sku-data" },
      { navId: "nav-manage-vendors", viewId: "view-manage-vendors" },
    ],
    (navId) => {
      document.getElementById("page-title").textContent = {
        "nav-po-tracking": "PO Tracking",
        "nav-sku-data": "SKU Level Data",
        "nav-manage-vendors": "Manage Vendors",
      }[navId];
    }
  );

  // Prefer the vendor_name the sync script already stamped onto the row
  // itself (works even if no login has been created for that vendor yet);
  // fall back to the profiles-based lookup, then the raw code.
  function vendorLabel(code, rowName) {
    return rowName || vendorNameByCode[code] || code || "";
  }

  function goToSkuData(poCode) {
    showSection("nav-sku-data");
    document.getElementById("sku-po-filter").value = poCode;
    renderSkuData();
  }

  function handleDownloadPdf(poCode, btn) {
    downloadPoPdf(client, poCode, btn);
  }

  async function main() {
    const ctx = await requireSession();
    if (!ctx) return;
    if (ctx.profile.role !== "admin") {
      window.location.href = "vendor.html";
      return;
    }
    client = ctx.client;
    document.getElementById("who-line").innerHTML = `<b>${escapeHtml(ctx.profile.vendor_name || "Admin")}</b>`;
    document.getElementById("signout-btn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "login.html";
    });

    await refreshAll();
    document.getElementById("sku-po-filter").addEventListener("change", renderSkuData);
    setInterval(refreshAll, POLL_INTERVAL_MS);
  }

  async function refreshAll() {
    await loadVendors();
    await loadData();
    document.getElementById("last-updated").textContent =
      "Page last checked " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  async function loadVendors() {
    const { data, error } = await client.from("profiles").select("*").eq("role", "vendor").order("created_at", { ascending: false });
    const box = document.getElementById("vendors-list");
    if (error) {
      box.innerHTML = `<div class="alert">Failed to load vendors: ${escapeHtml(error.message)}</div>`;
      return;
    }
    vendors = data;
    vendorNameByCode = Object.fromEntries(vendors.map(v => [v.vendor_code, v.vendor_name || v.vendor_code]));

    if (!vendors.length) {
      box.innerHTML = `<div class="empty-state">No vendor logins created yet — use the form above.</div>`;
    } else {
      box.innerHTML = `<div class="table-card"><div class="table-scroll"><table>
        <thead><tr><th>Vendor name</th><th>Email</th><th>Created</th></tr></thead>
        <tbody>${vendors.map(v => `<tr>
          <td>${escapeHtml(v.vendor_name || v.vendor_code)}</td>
          <td class="mono">${escapeHtml(v.email || "–")}</td>
          <td class="mono">${fmtDate(v.created_at)}</td>
        </tr>`).join("")}</tbody>
      </table></div></div>`;
    }

    refreshVendorFilterOptions();
  }

  // Repopulates just the Vendor column filter's <option>s (e.g. right
  // after creating a new vendor login) without rebuilding the rest of the
  // filter-row shell. No-op before the shell exists yet (initial load
  // calls loadVendors() before renderPoTracking() has run once).
  function refreshVendorFilterOptions() {
    const select = document.getElementById("pf-vendor");
    if (!select) return;
    const previousValue = select.value;
    select.querySelectorAll("option[data-vendor-option]").forEach(opt => opt.remove());
    for (const v of vendors) {
      const opt = document.createElement("option");
      opt.value = v.vendor_code;
      opt.textContent = v.vendor_name || v.vendor_code;
      opt.dataset.vendorOption = "1";
      select.appendChild(opt);
    }
    if ([...select.options].some(o => o.value === previousValue)) select.value = previousValue;
  }

  async function loadData() {
    const [{ data: pos, error: poErr }, { data: grns }, { data: poItems }, { data: grnItems }] = await Promise.all([
      client.from("purchase_orders").select("*").order("created_at", { ascending: false }),
      client.from("grns").select("*"),
      client.from("po_items").select("*"),
      client.from("grn_items").select("*"),
    ]);
    if (poErr) {
      document.getElementById("po-content").innerHTML = `<div class="alert">Failed to load purchase orders: ${escapeHtml(poErr.message)}</div>`;
      return;
    }

    currentPos = visiblePos(pos);
    const visibleCodes = new Set(currentPos.map(p => p.po_code));

    grnsByPo = {};
    grnByCode = {};
    for (const g of (grns || [])) {
      (grnsByPo[g.po_code] ||= []).push(g);
      grnByCode[g.grn_code] = g;
    }

    poItemsByPo = {};
    for (const it of (poItems || [])) {
      if (visibleCodes.has(it.po_code)) (poItemsByPo[it.po_code] ||= []).push(it);
    }

    grnItemsByPoSku = {};
    for (const gi of (grnItems || [])) {
      if (!visibleCodes.has(gi.po_code)) continue;
      const key = gi.po_code + "|" + gi.item_sku;
      (grnItemsByPoSku[key] ||= []).push(gi);
    }

    if (!poShellBuilt) {
      renderPoTracking();
      poShellBuilt = true;
    } else {
      renderPoTableBody();
    }
    populateSkuFilter();
    renderSkuData();
  }

  function poRowFields(p) {
    const grns = grnsByPo[p.po_code] || [];
    const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];
    return {
      vendor: vendorLabel(p.vendor_code, p.vendor_name),
      facility: p.facility || "",
      poCode: p.po_code || "",
      status: (STATUS_META[p.status] || [p.status])[0] || "",
      qtyOrdered: fmtNum(p.qty_ordered),
      qtyReceived: fmtNum(p.qty_received),
      poValue: fmtMoney(p.total_amount),
      grn: invoices.length ? invoices.join(", ") : "not yet raised",
    };
  }

  function poMatchesFilters(p, fields) {
    const f = poFilters;
    if (f.vendor && p.vendor_code !== f.vendor) return false;
    if (f.facility && fields.facility !== f.facility) return false;
    if (f.status && fields.status !== f.status) return false;
    for (const key of ["poCode", "qtyOrdered", "qtyReceived", "poValue", "grn"]) {
      if (f[key] && !fields[key].toLowerCase().includes(f[key].toLowerCase())) return false;
    }
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!Object.values(fields).some(v => String(v).toLowerCase().includes(q))) return false;
    }
    return true;
  }

  // Builds the outer shell (filter-row inputs included) ONCE -- see the
  // matching comment in vendor.html's renderPoTracking for why: rebuilding
  // these on every keystroke would steal focus from whatever the admin is
  // actively typing into. Only called on initial load; later poll
  // refreshes call renderPoTableBody() directly against this same shell.
  function renderPoTracking() {
    const facilities = [...new Set(currentPos.map(p => p.facility).filter(Boolean))].sort();
    const statuses = [...new Set(currentPos.map(p => (STATUS_META[p.status] || [p.status])[0]).filter(Boolean))].sort();

    const selectOptions = (values, current) =>
      `<option value="">All</option>` + values.map(v => `<option value="${escapeHtml(v)}" ${current === v ? "selected" : ""}>${escapeHtml(v)}</option>`).join("");
    const vendorOptions = `<option value="">All</option>` + vendors.map(v =>
      `<option value="${escapeHtml(v.vendor_code)}" data-vendor-option="1" ${poFilters.vendor === v.vendor_code ? "selected" : ""}>${escapeHtml(v.vendor_name || v.vendor_code)}</option>`
    ).join("");

    document.getElementById("po-content").innerHTML = `
      <div id="po-kpis-pills"></div>
      <div class="field" style="max-width: 340px; margin-bottom: 14px;">
        <label for="po-top-search">Search vendor, PO code, facility, status, invoice…</label>
        <input type="text" id="po-top-search" placeholder="Type to search…" value="${escapeHtml(poFilters.search)}">
      </div>
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Vendor</th><th>Facility</th><th>PO code</th><th>Status</th>
            <th class="num">Qty ordered</th><th class="num">Received</th><th class="num">PO value</th><th>GRN / invoice</th><th>PO Copy</th>
          </tr>
          <tr class="filter-row">
            <td><select id="pf-vendor">${vendorOptions}</select></td>
            <td><select id="pf-facility">${selectOptions(facilities, poFilters.facility)}</select></td>
            <td><input type="text" id="pf-poCode" placeholder="Filter…" value="${escapeHtml(poFilters.poCode)}"></td>
            <td><select id="pf-status">${selectOptions(statuses, poFilters.status)}</select></td>
            <td><input type="text" id="pf-qtyOrdered" placeholder="Filter…" value="${escapeHtml(poFilters.qtyOrdered)}"></td>
            <td><input type="text" id="pf-qtyReceived" placeholder="Filter…" value="${escapeHtml(poFilters.qtyReceived)}"></td>
            <td><input type="text" id="pf-poValue" placeholder="Filter…" value="${escapeHtml(poFilters.poValue)}"></td>
            <td><input type="text" id="pf-grn" placeholder="Filter…" value="${escapeHtml(poFilters.grn)}"></td>
            <td></td>
          </tr>
        </thead>
        <tbody id="po-tbody"></tbody>
      </table>
      </div></div>
    `;

    document.getElementById("po-top-search").addEventListener("input", e => { poFilters.search = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-vendor").addEventListener("change", e => { poFilters.vendor = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-facility").addEventListener("change", e => { poFilters.facility = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-poCode").addEventListener("input", e => { poFilters.poCode = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-status").addEventListener("change", e => { poFilters.status = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-qtyOrdered").addEventListener("input", e => { poFilters.qtyOrdered = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-qtyReceived").addEventListener("input", e => { poFilters.qtyReceived = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-poValue").addEventListener("input", e => { poFilters.poValue = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-grn").addEventListener("input", e => { poFilters.grn = e.target.value; renderPoTableBody(); });

    renderPoTableBody();
  }

  // Recomputes the filtered set and updates ONLY the KPI/pills container
  // and the tbody -- safe on every keystroke, never touches the filter
  // inputs themselves (see renderPoTracking above).
  function renderPoTableBody() {
    const filtered = currentPos.filter(p => poMatchesFilters(p, poRowFields(p)));

    document.getElementById("scope-line").textContent =
      `${currentPos.length} purchase order${currentPos.length === 1 ? "" : "s"} across all vendors` +
      (filtered.length !== currentPos.length ? ` · showing ${filtered.length} matching current filters` : "");

    document.getElementById("po-kpis-pills").innerHTML = "";

    const rows = filtered.map(p => {
      const grns = grnsByPo[p.po_code] || [];
      const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];
      const recv = grns.reduce((s, g) => s + (Number(g.total_received_amount) || 0), 0);
      const rej = grns.reduce((s, g) => s + (Number(g.total_rejected_amount) || 0), 0);
      const grnCell = grns.length === 0
        ? `<span class="cell-empty">not yet raised</span>`
        : `<div class="invoice-list">${escapeHtml(invoices.join(", ") || "–")}</div><div class="grn-amt">${fmtMoney(recv)}${rej ? ` <span class="grn-rej">−${fmtMoney(rej)} rej.</span>` : ""}</div>`;
      return `<tr>
        <td>${escapeHtml(vendorLabel(p.vendor_code, p.vendor_name))}</td>
        <td class="fac-code">${escapeHtml(p.facility)}</td>
        <td class="mono"><button class="link-btn-inline" onclick="goToSkuData('${p.po_code.replace(/'/g, "\\'")}')">${escapeHtml(p.po_code)}</button></td>
        <td>${statusChip(p.status)}</td>
        <td class="num mono">${fmtNum(p.qty_ordered)}</td>
        <td class="num mono">${fmtNum(p.qty_received)}</td>
        <td class="num mono">${fmtMoney(p.total_amount)}</td>
        <td>${grnCell}</td>
        <td><button class="link-btn-inline" onclick="handleDownloadPdf('${p.po_code.replace(/'/g, "\\'")}', this)">Download PDF</button></td>
      </tr>`;
    }).join("");

    document.getElementById("po-tbody").innerHTML = rows || `<tr><td colspan="9" class="empty-state">No purchase orders match these filters.</td></tr>`;
  }

  function populateSkuFilter() {
    const select = document.getElementById("sku-po-filter");
    const previousValue = select.value;
    select.querySelectorAll("option[data-po-option]").forEach(opt => opt.remove());
    for (const p of currentPos) {
      const opt = document.createElement("option");
      opt.value = p.po_code;
      opt.textContent = `${p.po_code} (${vendorLabel(p.vendor_code, p.vendor_name)})`;
      opt.dataset.poOption = "1";
      select.appendChild(opt);
    }
    if ([...select.options].some(o => o.value === previousValue)) {
      select.value = previousValue;
    }
  }

  function invoicesForItem(item) {
    const key = item.po_code + "|" + item.item_sku;
    const grnItems = grnItemsByPoSku[key] || [];
    const invoices = [...new Set(
      grnItems.map(gi => grnByCode[gi.grn_code]?.vendor_invoice_number).filter(Boolean)
    )];
    return invoices.join(", ") || "–";
  }

  function renderSkuData() {
    const filterCode = document.getElementById("sku-po-filter").value;
    const codes = filterCode ? [filterCode] : Object.keys(poItemsByPo);
    const rows = [];
    for (const code of codes) {
      const po = currentPos.find(p => p.po_code === code);
      for (const item of (poItemsByPo[code] || [])) {
        rows.push({ po, item });
      }
    }

    const tableRows = rows.map(({ po, item }) => `
      <tr>
        <td>${escapeHtml(vendorLabel(po?.vendor_code, po?.vendor_name))}</td>
        <td class="fac-code">${escapeHtml(po?.facility || "")}</td>
        <td class="mono">${escapeHtml(item.po_code)}</td>
        <td class="mono">${escapeHtml(item.item_sku)}</td>
        <td>${escapeHtml(item.item_name || "–")}</td>
        <td class="num mono">${fmtNum(item.quantity)}</td>
        <td class="num mono">${fmtNum(item.received_quantity)}</td>
        <td class="num mono">${fmtNum(item.pending_quantity)}</td>
        <td class="num mono">${fmtNum(item.rejected_quantity)}</td>
        <td class="num mono">${fmtMoney(item.unit_price)}</td>
        <td class="num mono">${fmtMoney(item.total)}</td>
        <td class="mono invoice-list">${escapeHtml(invoicesForItem(item))}</td>
      </tr>`).join("");

    document.getElementById("sku-content").innerHTML = `
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead><tr>
          <th>Vendor</th><th>Facility</th><th>PO code</th><th>SKU</th><th>Item</th>
          <th class="num">Qty ord</th><th class="num">Recv</th><th class="num">Pending</th><th class="num">Rejected</th>
          <th class="num">Unit price</th><th class="num">Total</th><th>Invoice No(s)</th>
        </tr></thead>
        <tbody>${tableRows || `<tr><td colspan="12" class="empty-state">No SKU data for this selection.</td></tr>`}</tbody>
      </table>
      </div></div>
    `;
  }

  document.getElementById("create-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msgBox = document.getElementById("create-msg");
    const btn = document.getElementById("create-btn");
    msgBox.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "Creating…";

    const email = document.getElementById("v-email").value.trim();
    const password = document.getElementById("v-password").value;
    const vendor_code = document.getElementById("v-code").value.trim();
    const vendor_name = document.getElementById("v-name").value.trim();

    const { data, error } = await client.functions.invoke("admin-create-vendor", {
      body: { email, password, vendor_code, vendor_name },
    });

    btn.disabled = false;
    btn.textContent = "Create login";

    if (error || data?.error) {
      msgBox.innerHTML = `<div class="form-error">${escapeHtml(data?.error || error.message)}</div>`;
      return;
    }

    msgBox.innerHTML = `<div class="form-success">Login created for ${escapeHtml(email)} (${escapeHtml(vendor_name || vendor_code)}). Share the email + temporary password with the vendor directly — this page will not show the password again.</div>`;
    document.getElementById("create-form").reset();
    await loadVendors();
  });

  main();
</script>
</body>
</html>
