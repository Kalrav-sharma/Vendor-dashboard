<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal — My POs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app-common.js"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">Vendor Portal</div>
      <button class="nav-item active" id="nav-po-tracking">PO Tracking</button>
      <button class="nav-item" id="nav-sku-data">SKU Level Data</button>
    </nav>

    <div class="main-content">
      <div class="wrap">
        <header class="page-head">
          <div>
            <h1 id="page-title">PO Tracking</h1>
            <div class="scope" id="scope-line">Loading…</div>
          </div>
          <div class="who">
            <button class="link-btn" id="signout-btn">Sign out</button>
          </div>
        </header>

        <div id="view-po-tracking">
          <div id="po-content"><div class="loading">Loading your data…</div></div>
        </div>

        <div id="view-sku-data" hidden>
          <div class="scope" style="margin-bottom: 14px;">SKUs with at least one open purchase order not yet fully supplied, highest pending quantity first. Click a SKU for the PO-level breakdown.</div>
          <div id="sku-content"><div class="loading">Loading…</div></div>
        </div>

        <footer class="page-foot">Data refreshes automatically every ~5 minutes from Uniware. <span id="last-updated"></span></footer>
      </div>
    </div>
  </div>

<script>
  const POLL_INTERVAL_MS = 60 * 1000;
  let client, profile, currentPos = [], poItemsByPo = {}, grnsByPo = {}, grnByCode = {}, grnItemsByPoSku = {};
  let poShellBuilt = false;
  let poFilters = { search: "", facility: "", poCode: "", status: "", qtyOrdered: "", qtyReceived: "", poValue: "", grn: "" };

  setupSidebarNav(
    [
      { navId: "nav-po-tracking", viewId: "view-po-tracking" },
      { navId: "nav-sku-data", viewId: "view-sku-data" },
    ],
    (navId) => {
      document.getElementById("page-title").textContent =
        navId === "nav-po-tracking" ? "PO Tracking" : "SKU Level Data";
    }
  );

  function handleDownloadPdf(poCode, btn) {
    downloadPoPdf(client, poCode, btn);
  }

  function invoicesForItem(item) {
    const key = item.po_code + "|" + item.item_sku;
    const grnItems = grnItemsByPoSku[key] || [];
    const invoices = [...new Set(
      grnItems.map(gi => grnByCode[gi.grn_code]?.vendor_invoice_number).filter(Boolean)
    )];
    return invoices.join(", ") || "–";
  }

  // Clicking a PO code anywhere (PO Tracking table, or from within the
  // SKU detail modal) opens this instead of navigating away.
  function openPoDetailModal(poCode) {
    const po = currentPos.find(p => p.po_code === poCode);
    if (!po) return;
    const items = poItemsByPo[poCode] || [];
    const grns = grnsByPo[poCode] || [];
    const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];

    const itemRows = items.map(item => `
      <tr>
        <td class="mono">${escapeHtml(item.item_sku)}</td>
        <td>${escapeHtml(item.item_name || "–")}</td>
        <td class="num mono">${fmtNum(item.quantity)}</td>
        <td class="num mono">${fmtNum(item.received_quantity)}</td>
        <td class="num mono">${fmtNum(item.pending_quantity)}</td>
        <td class="num mono">${fmtNum(item.rejected_quantity)}</td>
        <td class="num mono">${fmtMoney(item.unit_price)}</td>
        <td class="num mono">${fmtMoney(item.total)}</td>
        <td class="mono invoice-list">${escapeHtml(invoicesForItem(item))}</td>
      </tr>`).join("");

    const bodyHtml = `
      <div class="meta-grid">
        <div><b>Facility:</b> ${escapeHtml(po.facility)}</div>
        <div><b>Status:</b> ${statusChip(po.status)}</div>
        <div><b>Created:</b> ${fmtDate(po.created_at)}</div>
        <div><b>PO value:</b> ${fmtMoney(po.total_amount)}</div>
        <div><b>Invoice no(s):</b> ${escapeHtml(invoices.join(", ") || "not yet raised")}</div>
        <div><button class="link-btn-inline" onclick="handleDownloadPdf('${poCode.replace(/'/g, "\\'")}', this)">Download PDF</button></div>
      </div>
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead><tr>
          <th>SKU</th><th>Item</th><th class="num">Qty ord</th><th class="num">Recv</th><th class="num">Pending</th>
          <th class="num">Rejected</th><th class="num">Unit price</th><th class="num">Total</th><th>Invoice No(s)</th>
        </tr></thead>
        <tbody>${itemRows || `<tr><td colspan="9" class="empty-state">No line items on file.</td></tr>`}</tbody>
      </table>
      </div></div>
    `;
    showModal(`Purchase Order <span class="mono">${escapeHtml(poCode)}</span>`, bodyHtml);
  }

  async function loadAndRender() {
    const [{ data: pos, error: poErr }, { data: grns }, { data: poItems }, { data: grnItems }] = await Promise.all([
      client.from("purchase_orders").select("*").order("created_at", { ascending: false }),
      client.from("grns").select("*"),
      client.from("po_items").select("*"),
      client.from("grn_items").select("*"),
    ]);

    if (poErr) {
      document.getElementById("po-content").innerHTML = `<div class="alert">Failed to load purchase orders: ${escapeHtml(poErr.message)}</div>`;
      return;
    }

    currentPos = visiblePos(pos);

    document.getElementById("scope-line").textContent =
      `${currentPos.length} purchase order${currentPos.length === 1 ? "" : "s"} on file`;

    grnsByPo = {};
    grnByCode = {};
    for (const g of (grns || [])) {
      (grnsByPo[g.po_code] ||= []).push(g);
      grnByCode[g.grn_code] = g;
    }

    const visibleCodes = new Set(currentPos.map(p => p.po_code));
    poItemsByPo = {};
    for (const it of (poItems || [])) {
      if (visibleCodes.has(it.po_code)) (poItemsByPo[it.po_code] ||= []).push(it);
    }

    grnItemsByPoSku = {};
    for (const gi of (grnItems || [])) {
      if (!visibleCodes.has(gi.po_code)) continue;
      const key = gi.po_code + "|" + gi.item_sku;
      (grnItemsByPoSku[key] ||= []).push(gi);
    }

    if (!poShellBuilt) {
      renderPoTracking();
      poShellBuilt = true;
    } else {
      renderPoTableBody();
    }
    renderSkuData();

    document.getElementById("last-updated").textContent =
      "Page last checked " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  async function main() {
    const ctx = await requireSession();
    if (!ctx) return;
    client = ctx.client;
    profile = ctx.profile;

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "login.html";
    });

    await loadAndRender();
    setInterval(loadAndRender, POLL_INTERVAL_MS);
  }

  function poRowFields(p) {
    const grns = grnsByPo[p.po_code] || [];
    const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];
    return {
      facility: p.facility || "",
      poCode: p.po_code || "",
      status: (STATUS_META[p.status] || [p.status])[0] || "",
      qtyOrdered: fmtNum(p.qty_ordered),
      qtyReceived: fmtNum(p.qty_received),
      poValue: fmtMoney(p.total_amount),
      grn: invoices.length ? invoices.join(", ") : "not yet raised",
    };
  }

  function poMatchesFilters(fields) {
    const f = poFilters;
    if (f.facility && fields.facility !== f.facility) return false;
    if (f.status && fields.status !== f.status) return false;
    for (const key of ["poCode", "qtyOrdered", "qtyReceived", "poValue", "grn"]) {
      if (f[key] && !fields[key].toLowerCase().includes(f[key].toLowerCase())) return false;
    }
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!Object.values(fields).some(v => String(v).toLowerCase().includes(q))) return false;
    }
    return true;
  }

  // Builds the outer shell (KPI container + table incl. the filter-input
  // row) ONCE. Filter inputs are only ever created here, never recreated
  // by renderPoTableBody() -- otherwise every keystroke would rebuild the
  // input the user is actively typing into and steal focus after each
  // character. Only called on initial load; subsequent 60s poll refreshes
  // just call renderPoTableBody() directly, reusing this same shell.
  function renderPoTracking() {
    const facilities = [...new Set(currentPos.map(p => p.facility).filter(Boolean))].sort();
    const statuses = [...new Set(currentPos.map(p => (STATUS_META[p.status] || [p.status])[0]).filter(Boolean))].sort();

    const opt = (value, label) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;
    const selectOptions = (values, current) =>
      opt("", "All") + values.map(v => `<option value="${escapeHtml(v)}" ${current === v ? "selected" : ""}>${escapeHtml(v)}</option>`).join("");

    document.getElementById("po-content").innerHTML = `
      <div id="po-kpis-pills"></div>
      <div class="field" style="max-width: 340px; margin-bottom: 14px;">
        <label for="po-top-search">Search PO code, facility, status, invoice…</label>
        <input type="text" id="po-top-search" placeholder="Type to search…" value="${escapeHtml(poFilters.search)}">
      </div>
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Facility</th><th>PO code</th><th>Status</th>
            <th class="num">Qty ordered</th><th class="num">Received</th><th class="num">PO value</th><th>GRN / invoice</th><th>PO Copy</th>
          </tr>
          <tr class="filter-row">
            <td><select id="pf-facility">${selectOptions(facilities, poFilters.facility)}</select></td>
            <td><input type="text" id="pf-poCode" placeholder="Filter…" value="${escapeHtml(poFilters.poCode)}"></td>
            <td><select id="pf-status">${selectOptions(statuses, poFilters.status)}</select></td>
            <td><input type="text" id="pf-qtyOrdered" placeholder="Filter…" value="${escapeHtml(poFilters.qtyOrdered)}"></td>
            <td><input type="text" id="pf-qtyReceived" placeholder="Filter…" value="${escapeHtml(poFilters.qtyReceived)}"></td>
            <td><input type="text" id="pf-poValue" placeholder="Filter…" value="${escapeHtml(poFilters.poValue)}"></td>
            <td><input type="text" id="pf-grn" placeholder="Filter…" value="${escapeHtml(poFilters.grn)}"></td>
            <td></td>
          </tr>
        </thead>
        <tbody id="po-tbody"></tbody>
      </table>
      </div></div>
    `;

    document.getElementById("po-top-search").addEventListener("input", e => { poFilters.search = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-facility").addEventListener("change", e => { poFilters.facility = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-poCode").addEventListener("input", e => { poFilters.poCode = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-status").addEventListener("change", e => { poFilters.status = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-qtyOrdered").addEventListener("input", e => { poFilters.qtyOrdered = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-qtyReceived").addEventListener("input", e => { poFilters.qtyReceived = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-poValue").addEventListener("input", e => { poFilters.poValue = e.target.value; renderPoTableBody(); });
    document.getElementById("pf-grn").addEventListener("input", e => { poFilters.grn = e.target.value; renderPoTableBody(); });

    renderPoTableBody();
  }

  // Recomputes the filtered set and updates ONLY the KPI/pills container
  // and the tbody -- safe to call on every keystroke, never touches the
  // filter inputs themselves.
  function renderPoTableBody() {
    const filtered = currentPos.filter(p => poMatchesFilters(poRowFields(p))).sort(poSortComparator);

    const openCount = filtered.filter(p => !TERMINAL_STATUSES.has(p.status)).length;
    const totalOrdered = filtered.reduce((s, p) => s + (Number(p.qty_ordered) || 0), 0);
    const totalReceived = filtered.reduce((s, p) => s + (Number(p.qty_received) || 0), 0);
    const totalAmount = filtered.reduce((s, p) => s + (Number(p.total_amount) || 0), 0);
    const totalGrnAmount = filtered.reduce((s, p) => s + (grnsByPo[p.po_code] || []).reduce((s2, g) => s2 + (Number(g.total_received_amount) || 0), 0), 0);

    const statusCounts = {};
    for (const p of filtered) statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
    const statusPills = Object.entries(statusCounts).sort((a, b) => b[1] - a[1])
      .map(([s, c]) => `<div class="stat-pill">${statusChip(s)}<span class="stat-count">${c}</span></div>`).join("");

    document.getElementById("po-kpis-pills").innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="label">Purchase orders</div><div class="value">${filtered.length}</div></div>
        <div class="kpi"><div class="label">Still open</div><div class="value">${openCount}</div></div>
        <div class="kpi"><div class="label">Units ordered</div><div class="value">${fmtNum(totalOrdered)}</div></div>
        <div class="kpi"><div class="label">Units received</div><div class="value">${fmtNum(totalReceived)}</div></div>
        <div class="kpi"><div class="label">PO value</div><div class="value">${fmtMoney(totalAmount)}</div></div>
        <div class="kpi"><div class="label">GRN value received</div><div class="value">${fmtMoney(totalGrnAmount)}</div></div>
      </div>
      <div class="stat-pills">${statusPills}</div>
    `;

    const rows = filtered.map(p => {
      const grns = grnsByPo[p.po_code] || [];
      const invoices = [...new Set(grns.map(g => g.vendor_invoice_number).filter(Boolean))];
      const recv = grns.reduce((s, g) => s + (Number(g.total_received_amount) || 0), 0);
      const rej = grns.reduce((s, g) => s + (Number(g.total_rejected_amount) || 0), 0);
      const grnCell = grns.length === 0
        ? `<span class="cell-empty">not yet raised</span>`
        : `<div class="invoice-list">${escapeHtml(invoices.join(", ") || "–")}</div><div class="grn-amt">${fmtMoney(recv)}${rej ? ` <span class="grn-rej">−${fmtMoney(rej)} rej.</span>` : ""}</div>`;
      return `<tr>
        <td class="fac-code">${escapeHtml(p.facility)}</td>
        <td class="mono"><button class="link-btn-inline" onclick="openPoDetailModal('${p.po_code.replace(/'/g, "\\'")}')">${escapeHtml(p.po_code)}</button></td>
        <td>${statusChip(p.status)}</td>
        <td class="num mono">${fmtNum(p.qty_ordered)}</td>
        <td class="num mono">${fmtNum(p.qty_received)}</td>
        <td class="num mono">${fmtMoney(p.total_amount)}</td>
        <td>${grnCell}</td>
        <td><button class="link-btn-inline" onclick="handleDownloadPdf('${p.po_code.replace(/'/g, "\\'")}', this)">Download PDF</button></td>
      </tr>`;
    }).join("");

    document.getElementById("po-tbody").innerHTML = rows || `<tr><td colspan="8" class="empty-state">No purchase orders match these filters.</td></tr>`;
  }

  // Aggregates open (non-terminal), not-yet-fully-supplied POs by SKU.
  // Keyed by item_sku, re-populated on every renderSkuData() call and
  // read back by openSkuDetailModal() for its drill-down.
  let skuAggregates = {};

  function computeSkuAggregates() {
    const openPos = currentPos.filter(p => !TERMINAL_STATUSES.has(p.status));
    const map = {};
    for (const p of openPos) {
      for (const item of (poItemsByPo[p.po_code] || [])) {
        const pending = Number(item.pending_quantity) || 0;
        if (pending <= 0) continue; // this SKU line on this PO is already fully supplied
        const agg = (map[item.item_sku] ||= {
          item_sku: item.item_sku,
          item_name: item.item_name,
          qty_ordered: 0, qty_pending: 0, qty_received: 0,
          poCodes: new Set(), facilities: new Set(), details: [],
        });
        agg.qty_ordered += Number(item.quantity) || 0;
        agg.qty_pending += pending;
        agg.qty_received += Number(item.received_quantity) || 0;
        agg.poCodes.add(p.po_code);
        agg.facilities.add(p.facility);
        agg.details.push({
          po_code: p.po_code, facility: p.facility, status: p.status,
          qty_ordered: item.quantity, qty_pending: item.pending_quantity,
          qty_received: item.received_quantity, unit_price: item.unit_price,
        });
      }
    }
    return map;
  }

  function renderSkuData() {
    skuAggregates = computeSkuAggregates();
    const rows = Object.values(skuAggregates).sort((a, b) => b.qty_pending - a.qty_pending);

    const tableRows = rows.map(agg => `
      <tr class="clickable-row" onclick="openSkuDetailModal('${agg.item_sku.replace(/'/g, "\\'")}')">
        <td class="mono">${escapeHtml(agg.item_sku)}</td>
        <td>${escapeHtml(agg.item_name || "–")}</td>
        <td class="num mono">${fmtNum(agg.qty_ordered)}</td>
        <td class="num mono">${fmtNum(agg.qty_pending)}</td>
        <td class="num mono">${fmtNum(agg.qty_received)}</td>
        <td class="num mono">${agg.poCodes.size}</td>
        <td class="num mono">${agg.facilities.size}</td>
      </tr>`).join("");

    document.getElementById("sku-content").innerHTML = `
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead><tr>
          <th>SKU</th><th>Item</th>
          <th class="num">Qty ordered</th><th class="num">Qty pending</th><th class="num">Qty supplied</th>
          <th class="num">POs pending</th><th class="num">Facilities pending</th>
        </tr></thead>
        <tbody>${tableRows || `<tr><td colspan="7" class="empty-state">No SKUs currently pending — everything's been supplied.</td></tr>`}</tbody>
      </table>
      </div></div>
    `;
  }

  function openSkuDetailModal(itemSku) {
    const agg = skuAggregates[itemSku];
    if (!agg) return;

    const rows = agg.details
      .sort((a, b) => (Number(b.qty_pending) || 0) - (Number(a.qty_pending) || 0))
      .map(d => `
      <tr>
        <td class="mono"><button class="link-btn-inline" onclick="openPoDetailModal('${d.po_code.replace(/'/g, "\\'")}')">${escapeHtml(d.po_code)}</button></td>
        <td class="fac-code">${escapeHtml(d.facility)}</td>
        <td>${statusChip(d.status)}</td>
        <td class="num mono">${fmtNum(d.qty_ordered)}</td>
        <td class="num mono">${fmtNum(d.qty_pending)}</td>
        <td class="num mono">${fmtNum(d.qty_received)}</td>
        <td class="num mono">${fmtMoney(d.unit_price)}</td>
      </tr>`).join("");

    const bodyHtml = `
      <div class="table-card"><div class="table-scroll">
      <table>
        <thead><tr>
          <th>PO code</th><th>Facility</th><th>Status</th>
          <th class="num">Qty ordered</th><th class="num">Qty pending</th><th class="num">Qty received</th><th class="num">Unit price</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div></div>
    `;
    showModal(`${escapeHtml(agg.item_name || agg.item_sku)} <span class="mono">(${escapeHtml(agg.item_sku)})</span>`, bodyHtml);
  }

  main();
</script>
</body>
</html>
