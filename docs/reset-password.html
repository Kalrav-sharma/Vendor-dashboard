<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <div class="sub" id="sub-line">Checking your reset link…</div>
      <div id="error-box"></div>

      <form id="reset-form" hidden>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="primary-btn" id="submit-btn">Set new password</button>
      </form>

      <div id="invalid-link-box" hidden>
        <div class="form-error">This reset link is invalid or has expired.</div>
        <a href="login.html">Request a new one</a>
      </div>
    </div>
  </div>

<script>
  const client = getSupabaseClient();
  const errorBox = document.getElementById("error-box");
  const subLine = document.getElementById("sub-line");
  const form = document.getElementById("reset-form");
  const submitBtn = document.getElementById("submit-btn");

  let sessionReady = false;

  function showForm() {
    if (sessionReady) return; // avoid double-handling if both signals fire
    sessionReady = true;
    subLine.textContent = "Choose a new password for your account.";
    form.hidden = false;
  }

  function showInvalid() {
    if (sessionReady) return;
    subLine.textContent = "";
    document.getElementById("invalid-link-box").hidden = false;
  }

  // Supabase's client auto-detects the recovery token in this page's URL
  // (the link from the reset email) and fires this event once a session
  // is established from it.
  client.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") showForm();
  });

  // Fallback in case a session already exists by the time this runs (or
  // the PASSWORD_RECOVERY event fired before the listener above attached).
  client.auth.getSession().then(({ data: { session } }) => {
    if (session) showForm();
  });

  // If neither signal shows up within a few seconds, the link was invalid/expired.
  setTimeout(() => { if (!sessionReady) showInvalid(); }, 4000);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";
    const newPassword = document.getElementById("new-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (newPassword !== confirmPassword) {
      errorBox.innerHTML = `<div class="form-error">Passwords don't match.</div>`;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Setting password…";

    const { error } = await client.auth.updateUser({ password: newPassword });

    if (error) {
      errorBox.innerHTML = `<div class="form-error">${error.message}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Set new password";
      return;
    }

    // Sign out of the recovery session so they log in fresh with the new
    // password, rather than staying silently signed in via the reset link.
    await client.auth.signOut();
    window.location.href = "login.html";
  });
</script>
</body>
</html>
