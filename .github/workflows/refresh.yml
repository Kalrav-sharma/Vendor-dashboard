name: Sync Uniware PO/GRN data to Supabase

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/sync_to_supabase.py
        env:
          UNIWARE_USERNAME: ${{ secrets.UNIWARE_USERNAME }}
          UNIWARE_PASSWORD: ${{ secrets.UNIWARE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit heartbeat file
        run: |
          git config user.name "lexcru-po-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/.last_sync
          git diff --cached --quiet && echo "No changes" || git commit -m "Sync heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
