name: Refresh Lexcru PO Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_and_render.py
        env:
          UNIWARE_USERNAME: ${{ secrets.UNIWARE_USERNAME }}
          UNIWARE_PASSWORD: ${{ secrets.UNIWARE_PASSWORD }}

      - name: Commit and push updated dashboard
        run: |
          git config user.name "lexcru-po-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
