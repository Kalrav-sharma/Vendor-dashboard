name: Sync S&OP production to Supabase

# Every 30 min during business hours IST (04:00-18:30 UTC = 09:30 AM-midnight
# IST) -- this is the live Planned/Actual/Delta view, so it should track
# close to real-time -- plus workflow_dispatch for an immediate manual run.
on:
  schedule:
    - cron: '*/30 4-18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/sync_sop_production.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
