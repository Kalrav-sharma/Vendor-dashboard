name: Sync Mid Mile rate card to Supabase

# Runs automatically once a day at 3:00 AM IST (21:30 UTC) -- deep
# off-hours, chosen so nobody is realistically using Rate Finder during
# the brief delete-then-insert window (see replace_rows() in
# sync_mm_rate_card.py). "Run workflow" in the Actions tab still works too,
# for whenever Kalrav wants an immediate resync right after editing the
# sheet rather than waiting for the next 3 AM run.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/sync_mm_rate_card.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
