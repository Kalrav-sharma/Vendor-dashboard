name: TEMP - Jarvis reachability test

# One-shot, throwaway: does a GitHub-hosted runner reach Jarvis's actual
# REDASH API (not just the bare homepage, which a WAF can serve a generic
# block page for regardless of the real app's own state) and get back
# real query data? Delete this file once the SLA-rules pull's real home
# (GitHub-hosted vs a VPN-reachable runner) is decided.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: hit the real Jarvis query-results API
        env:
          JARVIS_API_KEY: ${{ secrets.JARVIS_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            -H "Authorization: Key $JARVIS_API_KEY" \
            "https://jarvis.urbanclap.com/api/queries/562880/results.json" || echo "000")
          echo "HTTP status: $code"
          echo
          if [ "$code" = "200" ] && grep -q '"query_result"' /tmp/body.json; then
            echo "RESULT: REAL DATA -- a GitHub-hosted runner CAN pull this query directly."
            python3 -c "
import json
d = json.load(open('/tmp/body.json'))
qr = d['query_result']
cols = [c['name'] for c in qr['data']['columns']]
rows = qr['data']['rows']
print('columns:', cols)
print('row count:', len(rows))
if rows:
    print('sample row:', {k: rows[0].get(k) for k in cols[:6]})
"
          else
            echo "RESULT: BLOCKED or FAILED -- likely IP-allowlisted, needs a VPN-reachable runner."
            echo "--- response body (first 500 chars) ---"
            head -c 500 /tmp/body.json
            exit 1
          fi
